<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise ✨</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Glitter Effect Background -->
    <div class="glitter-container">
        <span class="glitter"></span>
        <span class="glitter"></span>
        <span class="glitter"></span>
        <span class="glitter"></span>
        <span class="glitter"></span>
        <span class="glitter"></span>
        <span class="glitter"></span>
        <span class="glitter"></span>
        <span class="glitter"></span>
        <span class="glitter"></span>
        <span class="glitter"></span>
        <span class="glitter"></span>
        <span class="glitter"></span>
        <span class="glitter"></span>
        <span class="glitter"></span>
    </div>

    <div id="screen-passcode" class="screen active">
        <div class="main-card">
            
            <div class="left-section">
                <div class="cat-frame">
                    <img src="cat.jpg" alt="Cute Cat" class="cat-img">
                </div>
            </div>

            <div class="right-section">
                <h2 class="title-text">✨ Enter Your Birthday ✨</h2>
                
                <div class="dots-container">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>

                <div class="keypad">
                    <button onclick="pressKey(1)">1</button>
                    <button onclick="pressKey(2)">2</button>
                    <button onclick="pressKey(3)">3</button>
                    <button onclick="pressKey(4)">4</button>
                    <button onclick="pressKey(5)">5</button>
                    <button onclick="pressKey(6)">6</button>
                    <button onclick="pressKey(7)">7</button>
                    <button onclick="pressKey(8)">8</button>
                    <button onclick="pressKey(9)">9</button>
                    <button class="btn-action" onclick="clearCode()">C</button>
                    <button onclick="pressKey(0)">0</button>
                    <button class="btn-action" onclick="checkCode()">🔓</button>
                </div>
            </div>

        </div>
    </div>


    <div id="screen-question" class="screen">
        <div class="glass-card">
            
            <h2 id="animated-text" class="question-text"></h2>
            
            <div class="gif-container">
                <img src="cute-box.gif" alt="Cute Box Cat" class="card-gif">
            </div>

            <div class="btn-group">
                <button class="btn-yes" onclick="showScreen('screen-happy-birthday')">YES</button>
                <button class="btn-no" onclick="showScreen('screen-wrong-choice')">NO</button>
            </div>
        </div>
    </div>


    <div id="screen-wrong-choice" class="screen">
        <div class="glass-card">
            <h2 class="error-title">Why did u click no?!</h2>
            
            <div class="gif-container">
                <img src="sad-cute.gif" alt="Sad Cat" class="card-gif">
            </div>

            <button class="btn-try-again" onclick="showScreen('screen-question')">TRY AGAIN</button>
        </div>
    </div>


    <div id="screen-happy-birthday" class="screen">
        <div class="birthday-card">
            
            <div class="birthday-left">
                <div class="birthday-cat-frame">
                    <img src="download (8).jpg" alt="Happy Birthday Cat" class="birthday-cat-img">
                </div>
            </div>

            <div class="birthday-right">
                <div class="wish-box">
                    
                    <span class="deco-element top-left">❤️</span>
                    <span class="deco-element top-right">❤️</span>
                    <span class="deco-element bottom-left">❤️</span>
                    <span class="deco-element bottom-right">❤️</span>
                    
                    <h2 class="wish-title">Happy Birthday! ❤️</h2>
                    
                    <p id="wish-text" class="wish-paragraph"></p>
                </div>

                <button class="btn-next" onclick="showScreen('screen-memories')">NEXT ✨</button>
            </div>

        </div>
    </div>


    <div id="screen-memories" class="screen">
        <div class="memories-container-horizontal">
            
            <div class="horizontal-frames-row">
                
                <div class="polaroid-frame frame-left">
                    <div class="frame-img-wrapper">
                        <img src="photo1.jpg" alt="Memory 1">
                    </div>
                </div>
                
                <div class="polaroid-frame frame-center">
                    <div class="frame-img-wrapper">
                        <img src="photo2.jpg" alt="Memory 2">
                    </div>
                </div>
                
                <div class="polaroid-frame frame-right">
                    <div class="frame-img-wrapper">
                        <img src="photo3.jpg" alt="Memory 3">
                    </div>
                </div>

            </div>

            <div class="horizontal-text-section">
                <h1 class="memories-title">Our Sweetest Moments</h1>
                <p class="memories-paragraph-short">
                    Every picture has a story, and these are my absolute favorites. Thank you for making my life so incredibly beautiful. ❤️
                </p>
                <button class="btn-continue" onclick="showScreen('screen-solo-picture')">NEXT 💕</button>
            </div>

        </div>
    </div>

    <div id="screen-solo-picture" class="screen">
        <div class="solo-picture-card">
            <div class="solo-picture-frame">
                <img src="solo.jpg" alt="Special You" class="solo-picture-img">
            </div>
            <div class="solo-message-box">
                <p id="emotional-message" class="emotional-message"></p>
            </div>
            <button class="btn-restart" onclick="showScreen('screen-passcode')">AGAIN 💫</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
